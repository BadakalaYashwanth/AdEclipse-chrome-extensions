<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdEclipse</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <img src="icons/icon48.png" alt="Logo" class="logo" id="logo_img">
                <h1>AdEclipse</h1>
            </div>
            <button id="settings-btn" title="Settings" class="icon-btn">⚙️</button>
        </header>

        <main>
            <div class="control-group">
                <div class="label-group">
                    <h2>Ad Blocking</h2>
                    <p id="status-text">Active</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-blocking">
                    <span class="slider round"></span>
                </label>
            </div>
            
            <div class="stats invisible" id="stats-area">
                <!-- Placeholder for future stats -->
                <p>Protection is running.</p>
            </div>
        </main>
        
        <footer>
            <a href="#" id="report-issue">Report Issue</a>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
